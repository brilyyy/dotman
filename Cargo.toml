[package]
name = "dotman"
version = "1.0.0"
edition = "2024"
authors = ["Brilyan <49208216+brilyyy@users.noreply.github.com>"]
description = "Fast, safe, and transparent dotfile manager in Rust"
repository = "https://github.com/brilyyy/dotman"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.5"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
dirs = "6.0"
anyhow = "1.0"
dialoguer = { version = "0.11", default-features = false }
similar = { version = "2.6", default-features = false, features = ["text"] }
indexmap = { version = "2.7", default-features = false, features = ["serde"] }
console = { version = "0.15", default-features = false, features = ["ansi-parsing"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
