name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            musl_pkg: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            musl_pkg: false
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            musl_pkg: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            musl_pkg: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.musl_pkg
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip release binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/dotman"
          strip "$BIN" 2>/dev/null || true

      - name: Package release assets
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/dotman"
          ASSET_NAME="dotman-${{ matrix.target }}"
          
          mkdir -p dist
          cp "$BIN" dist/dotman
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf "${ASSET_NAME}.tar.gz" -C dist .
          
          # Standalone binary for direct curl installer
          cp "$BIN" "${ASSET_NAME}"

          # Compute SHA-256
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dotman-${{ matrix.target }}.tar.gz
            dotman-${{ matrix.target }}.tar.gz.sha256
            dotman-${{ matrix.target }}
            dotman-${{ matrix.target }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum dotman-*.tar.gz > checksums.txt 2>/dev/null || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
