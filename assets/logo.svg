<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Orange Glow -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="orangeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e40"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#232936" stroke-width="2"/>

  <!-- Logo Geometry Group -->
  <g transform="translate(10, 0)">
    <!-- Cyan Structural Network Lines -->
    <g stroke="url(#cyanLineGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- Vertical Spine -->
      <line x1="160" y1="130" x2="160" y2="382"/>

      <!-- Top horizontal and curve -->
      <line x1="160" y1="130" x2="260" y2="130"/>
      
      <!-- Outer D Arc -->
      <path d="M 260,130 C 350,130 380,200 380,256 C 380,312 350,382 260,382" fill="none" stroke-width="7"/>

      <!-- Bottom horizontal -->
      <line x1="160" y1="382" x2="260" y2="382"/>

      <!-- Diagonal Lattice Lines -->
      <line x1="160" y1="130" x2="225" y2="256"/>
      <line x1="160" y1="256" x2="260" y2="130"/>
      <line x1="260" y1="130" x2="380" y2="256"/>
      <line x1="160" y1="382" x2="225" y2="256"/>
      <line x1="160" y1="256" x2="260" y2="382"/>
      <line x1="260" y1="382" x2="380" y2="256"/>
    </g>

    <!-- Rust Orange Symlink Central Bridge (Dotfile Core to Target) -->
    <g filter="url(#orangeGlow)">
      <line x1="225" y1="256" x2="380" y2="256" stroke="url(#orangeLineGrad)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="225" cy="256" r="14" fill="#ff7e40"/>
      <circle cx="380" cy="256" r="16" fill="#f97316"/>
    </g>

    <!-- Cyan Nodes (Dotfile Manifest / System Targets) -->
    <g filter="url(#cyanGlow)">
      <!-- Spine Nodes -->
      <circle cx="160" cy="130" r="14" fill="#00f2fe"/>
      <circle cx="160" cy="256" r="14" fill="#00f2fe"/>
      <circle cx="160" cy="382" r="14" fill="#00f2fe"/>

      <!-- Arc Anchor Nodes -->
      <circle cx="260" cy="130" r="14" fill="#00f2fe"/>
      <circle cx="260" cy="382" r="14" fill="#00f2fe"/>
    </g>

    <!-- Node Inner Highlights -->
    <circle cx="160" cy="130" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="160" cy="256" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="160" cy="382" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="260" cy="130" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="260" cy="382" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="225" cy="256" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="380" cy="256" r="7" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
